question:
  polar_placeholder: /assets/images/cinema/polar-ice-placeholder.svg
  sea_level: /assets/images/findings/walis-map.png
  climate: /assets/images/findings/synthetic-summary.png
  lab_placeholder: /assets/images/cinema/lab-computer-placeholder.svg
  tabs:
    - id: ice
      icon: I
      label: Polar ice
      title: Which ice sheets crossed a threshold?
      text: HISEAS tests Greenland, West Antarctic, East Antarctic, and lingering Laurentide melt histories against Last Interglacial sea-level records.
      image: /assets/images/cinema/polar-ice-placeholder.svg
      caption: Calving ice, an ice margin, or a team image in a polar landscape would be a stronger final visual here.
    - id: sea
      icon: S
      label: Past sea level
      title: Where did local shorelines sit, and when?
      text: Raised reefs, fossil corals, WALIS observations, flexural corrections, and GIA modeling translate field indicators into global melt constraints.
      image: /assets/images/cook-field/makatea-person-scale.jpg
      caption: Makatea and raised reef morphology preserve sea-level markers that need elevation, age, and process context.
    - id: climate
      icon: C
      label: Paleoclimate
      title: What climate state forced the melt?
      text: Geochemistry, sediment cores, temperature proxies, iceberg discharge, sea ice, circulation, and vegetation records give the Earth system model a climate target.
      image: /assets/images/cook-field/geochem-sample-scale.jpg
      caption: Geochemical observations and proxy compilations connect coastal evidence to ocean and climate forcing.
    - id: inversion
      icon: M
      label: Models
      title: Which histories survive the inversion?
      text: CLIMBER-X, PISM, VILMA, sea-level fingerprints, emulators, and Bayesian inversion test many ice histories against many observations.
      image: /assets/images/proposal/proposal-overview-figure-2.jpg
      caption: Proposal Figure 2 shows the coupled model and observation architecture behind HISEAS.
