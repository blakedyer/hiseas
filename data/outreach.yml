slug: outreach
title: Outreach
intro: HISEAS pairs research with public scientific literacy, public policy relevance, and STEM workforce development.
body:
  - Through our research, the HISEAS team seeks to bolster public scientific literacy and engagement with science alongside informing public policy.
  - Additionally, we aim to support the development of a diverse, globally competitive STEM workforce. We work with a focus on decolonizing science.
events_title: Public Engagement Events
events_intro: The HISEAS team strives to bolster public engagement with our research through outreach events. Everyone is encouraged to attend.
events:
  - Lamont-Doherty Earth Observatory (LDEO) Open House
  - Exhibits at the American Museum of Natural History
  - Collaborations with the Florida Museum of Natural History
  - Science for Alaska lecture series
