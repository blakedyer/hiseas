items:
  - title: Last interglacial relative sea-level changes at Myrtle Beach, South Carolina
    authors: S. Dean, N. Georgiou, R. Poirier, W.R. Doar, D. Brill, D. Chauveau, C. Cerrone, J. Austermann, A. Rovere
    year: 2026
    journal: Quaternary Science Reviews
    volume: Volume 375, 109769
    issn: ISSN 0277-3791
    doi: https://doi.org/10.1016/j.quascirev.2025.109769
    summary: The peak of the Last Interglacial (Marine Isotope Stage 5e; approx. 128-117 ky) provides a valuable analogue for understanding sea level rise under future warming scenarios. Relative sea-level indicators from passive margins are essential for constraining past sea levels and refining glacio-hydro-isostatic adjustment models, thereby enhancing projections of future sea-level change and associated regional impacts. This study presents new luminescence ages from 17 sediment samples in outcrops along the Intracoastal Waterway near Myrtle Beach, South Carolina, and compares the observations with GIA model outputs.
