slug: findings
title: Findings
intro: Emerging HISEAS results and manuscript-in-preparation material, shown with explicit draft status and cautious language.
status_note: These summaries describe active manuscript work and should not be treated as peer-reviewed conclusions until publication.
highlights:
  - label: Manuscript in preparation
    title: Fingerprinting Last Interglacial Melt
    text: The manuscript combines WALIS sea-level observations with thousands of GIA models in a hierarchical Bayesian inversion accelerated by machine-learning emulators.
  - label: Working result
    title: Peak GMSL concentrated near about 5 m
    text: Draft manuscript text indicates peak LIG global mean sea level between 2.5 m and 7.4 m above present, with posterior density concentrated near about 5 m.
  - label: Working result
    title: Mixed Greenland and Antarctic contributions
    text: Draft manuscript text suggests the spatial fingerprint is better explained by shared Greenland and Antarctic melt than by complete collapse of one ice sheet alone.
  - label: Data need
    title: Southern Hemisphere records remain critical
    text: The manuscript notes that existing data weakly resolves the Antarctic sector split, motivating precise records in regions where WAIS and EAIS fingerprints diverge.
